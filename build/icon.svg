<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1b3a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <path d="M16 260 C140 200 300 330 496 230 L496 388 a108 108 0 0 1 -108 108 H124 a108 108 0 0 1 -108 -108 Z" fill="#ffffff" opacity="0.08"/>

  <!-- employee ID card -->
  <g filter="url(#sh)">
    <rect x="92" y="132" width="300" height="236" rx="30" fill="#ffffff"/>
  </g>
  <rect x="92" y="132" width="300" height="52" rx="30" fill="#dbeafe"/>
  <rect x="92" y="158" width="300" height="26" fill="#dbeafe"/>
  <rect x="210" y="148" width="64" height="14" rx="7" fill="#93c5fd"/>
  <!-- avatar -->
  <circle cx="168" cy="250" r="30" fill="#2563eb"/>
  <path d="M120 330 a48 44 0 0 1 96 0 Z" fill="#2563eb"/>
  <!-- text lines -->
  <rect x="240" y="222" width="118" height="18" rx="9" fill="#1e3a8a"/>
  <rect x="240" y="256" width="96" height="14" rx="7" fill="#94a3b8"/>
  <rect x="240" y="286" width="110" height="14" rx="7" fill="#cbd5e1"/>

  <!-- cloud upload badge -->
  <g filter="url(#sh)">
    <circle cx="372" cy="364" r="78" fill="url(#badge)"/>
  </g>
  <circle cx="372" cy="364" r="78" fill="none" stroke="#ffffff" stroke-width="10"/>
  <path d="M338 392 h-6 a24 24 0 0 1 -2 -48 a34 34 0 0 1 64 -6 a26 26 0 0 1 10 54 h-8"
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M372 404 v-48 M352 374 l20 -20 l20 20" fill="none" stroke="#ffffff" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
